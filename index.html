<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B09">
<title>A Little Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="sky"><i class="shaft s1"></i><i class="shaft s2"></i><i class="cloud c1"></i><i class="cloud c2"></i></div>
  <canvas id="fx"></canvas>
  <div id="planet"></div>
  <img id="rose" alt="" decoding="async">
  <div id="scenes"></div>
  <div id="deck"></div>
  <p id="hint"></p>
  <div class="vignette"></div>
  <div class="grain"></div>
  <p id="err" hidden>Не удалось загрузить содержимое. Обнови страницу.</p>
</div>
<div id="track"></div>
<script src="script.js"></script>
</body>
</html>

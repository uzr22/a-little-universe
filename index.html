
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080B09">
    <meta name="description" content="A Little Universe — a little invitation.">

    <title>A Little Universe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <!-- SCENE 1: INTRO -->

        <section class="scene scene-intro" id="intro">
            <div class="scene-content">

                <p class="eyebrow">A LITTLE UNIVERSE</p>

                <h1>
                    Something<br>
                    beautiful<br>
                    begins here.
                </h1>

                <p class="intro-description">
                    Небольшое путешествие от одного цветка до целой Вселенной.
                </p>

                <button id="start-button">
                    Начать путешествие
                </button>

            </div>
        </section>


        
        
        <!-- SCENE 2: FLOWER -->
        
        <section class="scene scene-flower" id="flower" hidden>
        
            <div class="flower-background"></div>
            <div class="stars-background"></div>
        
            <div class="scene-content">
        
                <p class="eyebrow">THE BEGINNING</p>
        
                <h2 id="flower-title"></h2>
        
                <p id="flower-text"></p>
        
                <button id="flower-next-button">
                    Продолжить
                </button>
        
            </div>
        
        </section>




        <!-- SCENE 3: SPACE -->

        <section class="scene scene-space" id="space" hidden>

            <div class="scene-content">
                <p class="eyebrow">BEYOND THE ORDINARY</p>

                <h2 id="space-title"></h2>

                <p id="space-text"></p>
            </div>

        </section>


        <!-- SCENE 4: JUPITER -->

        <section class="scene scene-jupiter" id="jupiter" hidden>

            <div class="scene-content">
                <p class="eyebrow">THE UNIVERSE</p>

                <h2 id="jupiter-title"></h2>

                <p id="jupiter-text"></p>
            </div>

        </section>


        <!-- SCENE 5: PERSONAL STORY -->

        <section class="scene scene-story" id="story" hidden>

            <div class="scene-content">
                <p class="eyebrow">A LITTLE STORY</p>

                <h2 id="story-title"></h2>

                <p id="story-text"></p>
            </div>

        </section>


        <!-- SCENE 6: INVITATION -->

        <section class="scene scene-meeting" id="meeting" hidden>

            <div class="scene-content">
                <p class="eyebrow">AN INVITATION</p>

                <h2 id="meeting-title"></h2>

                <p id="meeting-description"></p>

                <div class="meeting-buttons">

                    <button id="accept-button"></button>

                    <button id="decline-button"></button>

                </div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
